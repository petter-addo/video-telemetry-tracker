<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video-tizen-js Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .video-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        #videoContainer {
            width: 100%;
            height: 500px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-placeholder {
            text-align: center;
        }

        .video-placeholder h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: #f44336;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-info {
            background: #2196F3;
        }

        .btn-info:hover {
            background: #0b7dda;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .log-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-entry {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            border-left: 3px solid #4CAF50;
        }

        .log-entry.error {
            border-left-color: #f44336;
        }

        .log-empty {
            text-align: center;
            padding: 40px;
            opacity: 0.6;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        .status-indicator.paused {
            background: #ff9800;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            #videoContainer {
                height: 300px;
            }
            
            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 video-tizen-js Demo</h1>
            <p>Tizen AVPlay Tracker with New Relic Analytics</p>
        </div>

        <div class="video-section">
            <div id="videoContainer">
                <div class="video-placeholder">
                    <h2>AVPlay Video Player</h2>
                    <p>Click "Open Video" to start</p>
                </div>
            </div>

            <div class="controls">
                <button id="btnOpen">📂 Open Video</button>
                <button id="btnPlay" disabled>▶️ Play</button>
                <button id="btnPause" disabled>⏸️ Pause</button>
                <button id="btnSeekBack" disabled>⏪ -10s</button>
                <button id="btnSeekForward" disabled>⏩ +10s</button>
                <button id="btnStop" class="btn-danger" disabled>⏹️ Stop</button>
                <button id="btnGetState" class="btn-info">📊 Get State</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="statStatus">
                    <span class="status-indicator paused"></span> Ready
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Current Time</div>
                <div class="stat-value" id="statTime">0:00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Duration</div>
                <div class="stat-value" id="statDuration">0:00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Events Tracked</div>
                <div class="stat-value" id="statEvents">0</div>
            </div>
        </div>

        <div class="log-section">
            <div class="log-title">
                📋 Event Log
                <button id="btnClearLog" style="margin-left: auto; padding: 6px 12px; font-size: 0.9rem;">Clear</button>
            </div>
            <div id="logContainer">
                <div class="log-empty">No events yet. Open and play a video to see analytics!</div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
